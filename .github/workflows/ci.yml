name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Plain Node, no Bun. Node 24 strips types natively, so the TS tests run as-is.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Audit dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Tests (node --test)
        run: npm test
      - name: Smoke-test the bundled CLI on Node
        run: |
          node dist/cli.mjs search "s3, lambda" >/dev/null
          node dist/cli.mjs scaffold build_vpc.mjs -o "$RUNNER_TEMP/smoke/build.mjs" --name smoke
          node "$RUNNER_TEMP/smoke/build.mjs" | grep -q '"ok":true'
          node dist/cli.mjs validate "$RUNNER_TEMP/smoke/smoke.drawio"
      # Install speed = package size. Fail the PR if the npm tarball grows past the budget.
      - name: Package size budget (packed ≤ 2.5 MB)
        run: |
          npm pack --json > "$RUNNER_TEMP/pack.json"
          size=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1]))[0].size' "$RUNNER_TEMP/pack.json")
          echo "packed: $size bytes"; echo "### npm package: $size bytes packed" >> "$GITHUB_STEP_SUMMARY"
          test "$size" -le 2621440 || { echo "::error::package is $size bytes (> 2.5 MB budget)"; exit 1; }
      - name: The packed tarball installs and runs
        run: |
          npm install --prefix "$RUNNER_TEMP/inst" --no-audit --no-fund ./drawio-ai-kit-*.tgz
          "$RUNNER_TEMP/inst/node_modules/.bin/drawio-ai" search lambda | grep -q '"name":"lambda"'
          test -f "$RUNNER_TEMP/inst/node_modules/drawio-ai-kit/skills/drawio/SKILL.md"

  # The user path: dist/ is plain ESM and must run on the oldest supported Node (>=20). No TypeScript, no tests.
  smoke-node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Smoke-test the bundled CLI on Node 20
        run: |
          node dist/cli.mjs search "s3, lambda" >/dev/null
          node dist/cli.mjs scaffold build_vpc.mjs -o "$RUNNER_TEMP/smoke/build.mjs" --name smoke
          node "$RUNNER_TEMP/smoke/build.mjs" | grep -q '"ok":true'
          node dist/cli.mjs validate "$RUNNER_TEMP/smoke/smoke.drawio"

  # The maintainer path: Bun runs the same suites, rebuilds dist/, and proves it is fresh + deterministic.
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: npm ci   # tsc (declarations) is a devDependency
      - name: Tests (bun test, with coverage report)
        run: bun test --coverage
      - name: dist/ is the fresh bundle of src/
        run: |
          bun run build
          git diff --exit-code --stat -- dist || { echo "::error::dist/ is stale — run 'bun run build' and commit it"; exit 1; }
      - name: The build is deterministic (second build matches the first)
        run: bun run build:check
      - name: Smoke-test the bundled CLI on Bun
        run: |
          bun dist/cli.mjs search "s3, lambda" >/dev/null
          bun dist/cli.mjs scaffold build_vpc.mjs -o "$RUNNER_TEMP/smoke/build.mjs" --name smoke
          bun "$RUNNER_TEMP/smoke/build.mjs" | grep -q '"ok":true'
          bun dist/cli.mjs validate "$RUNNER_TEMP/smoke/smoke.drawio"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install semgrep
      - name: Semgrep (deep SAST + secrets)
        run: >
          semgrep scan --error --metrics=off
          --config p/security-audit
          --config p/secrets
          --config p/owasp-top-ten
          --config p/command-injection
          --config p/javascript
          --config p/python
      - name: Secret scan (gitleaks)
        run: |
          VER=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --no-banner --redact --exit-code 1
